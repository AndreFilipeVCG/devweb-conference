<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Página de Login</h1>    
    <section id="formulário">
        <form>
            <p>
                <label for="email">Email:</label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    required
                >
            </p>

            <p>
                <label for="senha">Senha:</label>

                <input
                    type="senha"
                    id="senha"
                    name="senha"
                    required
                >
            </p>
            <button type="submit"><a href="index.html">Login</a></button>
        </form>
    </section>
    
</body>
</html>
